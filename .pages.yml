# Pages CMS configuration (pagescms.org). Edits here commit to the repo and the
# GitHub Action rebuilds & deploys the site (~2 min). Covers Insights, Projects,
# Products. Arabic field labels are bilingual (العربية + English). See CMS-PLAN.md.

media:
  input: new-live-site-design/assets1/images
  output: assets1/images
  extensions: [webp, jpg, jpeg, png, svg]

content:
  # ─────────────────────────── INSIGHTS ───────────────────────────
  - name: insights
    label: Insights
    type: collection
    path: new-live-site-design/_build/content/insights
    filename: '{fields.slug}.json'
    view:
      fields: [slug, order, iso]
      sort: [order, slug]
    fields:
      - { name: slug, label: Slug (URL id — lowercase-with-hyphens; page = insight-<slug>.html), type: string, required: true }
      - { name: order, label: Order (lower shows first on the hub), type: number, default: 99 }
      - { name: img, label: Card / hero image, type: image }
      - { name: iso, label: Date for search engines (ISO, e.g. 2026-09-16), type: date }
      - name: en
        label: English
        type: object
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: date, label: Date shown to readers (e.g. 16 September 2026), type: string }
          - { name: team, label: Byline (e.g. Systems team), type: string }
          - { name: dek, label: Summary / standfirst, type: text }
          - { name: meta, label: SEO meta description, type: text }
          - name: blocks
            label: Body
            type: object
            list: true
            fields:
              - { name: type, label: Type, type: select, options: { values: [p, h2] }, default: p }
              - { name: text, label: Text, type: text }
          - name: related
            label: Related services (internal links)
            type: object
            list: true
            fields:
              - { name: slug, label: Service page slug, type: string }
              - { name: label, label: Link text, type: string }
          - name: faq
            label: FAQ (drives the FAQ schema)
            type: object
            list: true
            fields:
              - { name: q, label: Question, type: string }
              - { name: a, label: Answer, type: text }
      - name: ar
        label: العربية / Arabic (first draft — needs native review)
        type: object
        fields:
          - { name: title, label: العنوان / Title, type: string }
          - { name: date, label: التاريخ / Date (display), type: string }
          - { name: team, label: الفريق / Byline, type: string }
          - { name: dek, label: الملخص / Summary, type: text }
          - { name: meta, label: وصف محرّكات البحث / SEO meta, type: text }
          - name: blocks
            label: المحتوى / Body
            type: object
            list: true
            fields:
              - { name: type, label: النوع / Type, type: select, options: { values: [p, h2] }, default: p }
              - { name: text, label: النص / Text, type: text }
          - name: related
            label: خدمات ذات صلة / Related services
            type: object
            list: true
            fields:
              - { name: slug, label: مُعرّف صفحة الخدمة / Service slug, type: string }
              - { name: label, label: نص الرابط / Link text, type: string }
          - name: faq
            label: الأسئلة الشائعة / FAQ
            type: object
            list: true
            fields:
              - { name: q, label: السؤال / Question, type: string }
              - { name: a, label: الجواب / Answer, type: text }

  # ─────────────────────────── PROJECTS (case studies) ───────────────────────────
  - name: projects
    label: Projects (case studies)
    type: collection
    path: new-live-site-design/_build/content/projects
    filename: '{fields.slug}.json'
    view:
      fields: [slug, order]
      sort: [order, slug]
    fields:
      - { name: slug, label: Slug (URL id — page = project-<slug>.html), type: string, required: true }
      - { name: order, label: Order, type: number, default: 99 }
      - { name: img, label: Hero image, type: image }
      - name: en
        label: English
        type: object
        fields:
          - { name: name, label: Project name, type: string, required: true }
          - { name: client, label: Client, type: string }
          - { name: sector, label: Sector, type: string }
          - { name: city, label: City, type: string }
          - { name: completed, label: Completed (e.g. 2024), type: string }
          - { name: date_iso, label: Completed date (ISO, optional), type: string }
          - { name: scope, label: Scope (one line), type: string }
          - { name: lede, label: Intro paragraph, type: text }
          - name: sections
            label: Narrative sections
            type: object
            list: true
            fields:
              - { name: h, label: Heading, type: string }
              - { name: ps, label: Paragraphs, type: text, list: true }
          - { name: kit, label: Systems delivered (chips), type: string, list: true }
          - name: gallery
            label: Photo gallery
            type: object
            list: true
            fields:
              - { name: img, label: Photo, type: image }
              - { name: cap, label: Caption, type: string }
      - name: ar
        label: العربية / Arabic (first draft — needs native review)
        type: object
        fields:
          - { name: name, label: اسم المشروع / Project name, type: string }
          - { name: client, label: العميل / Client, type: string }
          - { name: sector, label: القطاع / Sector, type: string }
          - { name: city, label: المدينة / City, type: string }
          - { name: completed, label: سنة الإنجاز / Completed, type: string }
          - { name: date_iso, label: تاريخ الإنجاز (ISO) / Completed date, type: string }
          - { name: scope, label: النطاق / Scope, type: string }
          - { name: lede, label: المقدمة / Intro, type: text }
          - name: sections
            label: أقسام السرد / Narrative sections
            type: object
            list: true
            fields:
              - { name: h, label: العنوان / Heading, type: string }
              - { name: ps, label: الفقرات / Paragraphs, type: text, list: true }
          - { name: kit, label: الأنظمة المُنفّذة / Systems delivered, type: string, list: true }
          - name: gallery
            label: معرض الصور / Photo gallery
            type: object
            list: true
            fields:
              - { name: img, label: الصورة / Photo, type: image }
              - { name: cap, label: التعليق / Caption, type: string }

  # ─────────────────────────── SHOWCASE PROJECTS (card only, no case study) ───────────────────────────
  - name: showcase
    label: Showcase projects (no case study)
    type: collection
    path: new-live-site-design/_build/content/showcase
    filename: '{fields.slug}.json'
    view:
      fields: [slug, order]
      sort: [order, slug]
    fields:
      - { name: slug, label: Slug (URL id — lowercase-with-hyphens), type: string, required: true }
      - { name: order, label: Order (lower shows first; leave gaps so you can insert between), type: number, default: 99 }
      - { name: img, label: Card image, type: image }
      - name: disc
        label: Disciplines (drives the projects filter)
        type: select
        list: true
        options:
          values:
            - { value: network-infrastructure-services, label: Network Infrastructure }
            - { value: datacenter-solutions, label: Datacenter Solutions }
            - { value: surveillance-and-security-solutions, label: Surveillance & Security }
            - { value: meeting-room-solutions, label: Meeting Room Solutions }
            - { value: audio-visual-solutions, label: Audio-Visual Solutions }
            - { value: digital-signage-amp-video-walls, label: Signage & Video Walls }
            - { value: public-address-and-fire-alarm-system, label: Public Address & Fire Alarm }
            - { value: iptv-solutions, label: IPTV Solutions }
            - { value: professional-services, label: Professional Services }
      - name: en
        label: English
        type: object
        fields:
          - { name: sector, label: Sector (e.g. Education), type: string }
          - { name: city, label: City, type: string }
          - { name: name, label: Project name, type: string, required: true }
          - { name: body, label: Card description, type: text }
          - { name: kit, label: Systems (chips), type: string, list: true }
          - { name: client, label: Client, type: string }
          - { name: scope, label: Scope (one line), type: string }
      - name: ar
        label: العربية / Arabic (first draft — needs native review)
        type: object
        fields:
          - { name: sector, label: القطاع / Sector, type: string }
          - { name: city, label: المدينة / City, type: string }
          - { name: name, label: اسم المشروع / Project name, type: string }
          - { name: body, label: وصف البطاقة / Card description, type: text }
          - { name: kit, label: الأنظمة / Systems, type: string, list: true }
          - { name: client, label: العميل / Client, type: string }
          - { name: scope, label: النطاق / Scope, type: string }

  # ─────────────────────────── PRODUCTS ───────────────────────────
  - name: products
    label: Products
    type: collection
    path: new-live-site-design/_build/content/products
    filename: '{fields.sku}.json'
    view:
      fields: [sku, n, b, c]
      sort: [order, sku]
    fields:
      - { name: sku, label: SKU / model code, type: string, required: true }
      - { name: order, label: Order, type: number, default: 99 }
      - { name: n, label: Name / description, type: string }
      - { name: b, label: Brand, type: string }
      - { name: c, label: Category, type: string }
      - { name: g, label: Group (e.g. switch, camera), type: string }
      - { name: avail, label: Availability, type: select, options: { values: [stock, lead] } }
      - { name: lead, label: Lead time in days (only if availability = lead), type: number }
      - name: specs
        label: Specifications
        type: object
        list: true
        fields:
          - { name: label, label: Spec, type: string }
          - { name: value, label: Value, type: string }
