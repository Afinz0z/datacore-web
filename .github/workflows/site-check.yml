name: Daily site check

# Every morning (05:30 Riyadh time) request every page of the published site and its shared files.
# If anything does not answer, open an issue listing it (GitHub emails the repository owner), or add
# the new list to the open one. When everything answers again, the issues this check opened are closed.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Request every page on the live site
        id: live
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
        run: |
          python new-live-site-design/_build/check_live.py \
            "https://${REPO%%/*}.github.io/${REPO#*/}" --report report.md
      # Only issues this workflow opened (author github-actions) are updated or closed.
      - name: Open or update an issue when something is broken
        if: steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create site-check --color B60205 --description "Found by the daily site check" --force
          n=$(gh issue list --label site-check --state open --app github-actions --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file report.md
          else
            gh issue create --title "Site check: pages not answering" --label site-check --body-file report.md
          fi
      - name: Close the issue once everything answers again
        if: steps.live.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label site-check --state open --app github-actions --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The daily check passed: every page answers again."
          done
