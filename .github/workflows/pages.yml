name: Build and deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publish ONLY the New Live Site Design (the mirror) as the site root.
      # The from-scratch rebuild in src/ is kept in the repo but no longer
      # deployed — restore the python build + `path: dist` to bring it back.
      - name: Disable Jekyll processing
        run: touch new-live-site-design/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: new-live-site-design

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
