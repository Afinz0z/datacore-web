name: Build and deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One group per branch, so a manual check of another branch never cancels a master deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # full history: sitemap dates come from each page's last change
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # The generators run from _build, so Python imports from there before anything else: a new
      # json.py or product_data/ folder there would run in place of the real one. Only the known
      # scripts and folders may sit there; add a new script to this list when it belongs.
      - name: Check _build holds only the known scripts
        working-directory: new-live-site-design/_build
        run: |
          extra=$({ find . -mindepth 1 -maxdepth 1 \
            \( -type d -o -type l -o -name '*.py' -o -name '*.pyc' -o -name '*.so' -o -name '*.pyd' \) \
            ! -name content ! -name __pycache__ \
            ! -name build_extra.py ! -name build_pages.py ! -name build_products.py ! -name build_services.py \
            ! -name check_live.py ! -name check_site.py ! -name import_products.py ! -name make_thumbs.py \
            ! -name product_data.py -print; find . -name '*.pyc' -print; } | sort -u)
          if [ -n "$extra" ]; then
            echo "::error::Unexpected Python files or folders in _build:"
            echo "$extra"
            exit 1
          fi
      # Regenerate the mirror's data-driven pages from the content JSON in
      # new-live-site-design/_build/ (pure stdlib — no pip installs needed).
      # A CMS/content edit to that JSON re-runs this and publishes automatically.
      - name: Build the site (Python generators)
        working-directory: new-live-site-design/_build
        run: |
          python build_pages.py
          python build_products.py
          python build_services.py
          python build_extra.py
      # Stop here if any page links to a file that is not there (pages, images, scripts, stylesheets,
      # sitemap addresses), so a broken build is never published.
      - name: Check every page and link
        working-directory: new-live-site-design/_build
        run: python check_site.py
      - name: Disable Jekyll processing
        run: touch new-live-site-design/.nojekyll
      # Publish the website only: the generators and the plain-text guide
      # stay in the repository but are not served.
      - name: Stage the public site
        run: |
          rsync -a --exclude '/_build/' --exclude '/.gitignore' --exclude '/readme.txt' \
            --exclude '/assets1/vendor/MANIFEST.txt' new-live-site-design/ _site/
      # The upload follows symlinks, so a link would publish whatever it points at.
      - name: Refuse symlinks and compiled Python in the public site
        run: |
          bad=$(find _site \( -type l -o -name '*.pyc' \) -print)
          if [ -n "$bad" ]; then
            echo "::error::Symlinks or .pyc files in the public site:"
            echo "$bad"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
