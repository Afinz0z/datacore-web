name: Build and deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Regenerate the mirror's data-driven pages from the content JSON in
      # new-live-site-design/_build/ (pure stdlib — no pip installs needed).
      # A CMS/content edit to that JSON re-runs this and publishes automatically.
      - name: Build the site (Python generators)
        working-directory: new-live-site-design/_build
        run: |
          python build_pages.py
          python build_products.py
          python build_services.py
          python build_extra.py
      - name: Disable Jekyll processing
        run: touch new-live-site-design/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: new-live-site-design

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
